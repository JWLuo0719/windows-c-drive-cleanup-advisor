[package]
name = "windows-c-drive-cleanup-advisor"
version = "0.2.0"
description = "Read-only Windows C drive cleanup advisor desktop app"
authors = ["Windows C Drive Cleanup Advisor"]
edition = "2021"

[lib]
name = "windows_c_drive_cleanup_advisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "windows-c-drive-cleanup-advisor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
